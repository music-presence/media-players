name: "Setup"
description: Setup for invoking tasks
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Git
      shell: bash
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "<>"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Load version number into environment
      shell: bash
      run: |
        echo "API_VERSION=$(python -c 'from scripts.version import VERSION; print(VERSION)')" >> "$GITHUB_ENV"
