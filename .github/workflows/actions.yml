name: deploy

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/v')
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        env:
          API_BASE_URL: https://example.com
        run: invoke build

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Deploy
        env:
          API_BASE_URL: https://live.musicpresence.app/v${{ env.API_VERSION }}
          DEPLOY_REPO: https://${{ secrets.ACTIONS_GITHUB_TOKEN }}@github.com/music-presence/live.git
          DEPLOY_OUTPUT_DIR: v${{ env.API_VERSION }}
          DEPLOY_BRANCH: master
        run: invoke deploy

  deploy-test:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/v')
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Deploy
        env:
          API_BASE_URL: https://music-presence.github.io/live-test/v${{ env.API_VERSION }}
          DEPLOY_REPO: https://${{ secrets.ACTIONS_GITHUB_TOKEN_DEPLOY_LIVE_TEST }}@github.com/music-presence/live-test.git
          DEPLOY_OUTPUT_DIR: ${{ github.ref_name }}
          DEPLOY_BRANCH: master
        run: invoke deploy
