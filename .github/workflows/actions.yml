name: deploy

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Load build.env
        run: cat build.env >> "$GITHUB_ENV"
      - name: Deploy
        env:
          API_BASE_URL: https://music-presence.github.io/live-test/v${{ env.API_VERSION }}
          DEPLOY_REPO: https://${{ secrets.ACTIONS_GITHUB_TOKEN }}@github.com/music-presence/live-test.git
          DEPLOY_OUTPUT_DIR: ${{ github.ref_name }}
          DEPLOY_BRANCH: master
        run: invoke deploy

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Load build.env
        run: cat build.env >> "$GITHUB_ENV"
      - name: Deploy
        env:
          API_BASE_URL: https://live.musicpresence.app/v${{ env.API_VERSION }}
          DEPLOY_REPO: https://${{ secrets.ACTIONS_GITHUB_TOKEN }}@github.com/music-presence/live.git
          DEPLOY_OUTPUT_DIR: v${{ env.API_VERSION }}
          DEPLOY_BRANCH: master
        run: invoke deploy
