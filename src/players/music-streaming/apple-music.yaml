# yaml-language-server: $schema=../../schemas/player.schema.json

id: apple-music
name: Apple Music
url: https://music.apple.com

caveats:
  windows_smtc_metadata_malformed: >-
    The metadata that is reported via System Media Transport Controls by the
    native windows app is incorrectly formatted and sometimes includes
    information that is not song metadata.
  web_playback_info_inaccurate: >-
    The web app tends to report inaccurate playback information and track
    durations most of the time, especially during longer playback sessions.

sources:
  mac_bundle:
    - com.apple.Music

  win_smtc:
    - app_user_model_id: AppleMusic.exe
      caveat: windows_smtc_metadata_malformed

    - app_user_model_id: AppleInc.AppleMusicWin_nzyj5cx40ttqa!APP
      caveat: windows_smtc_metadata_malformed

    - app_user_model_id: AppleInc.AppleMusicWin_nzyj5cx40ttqa!App
      caveat: windows_smtc_metadata_malformed

    - app_user_model_id: AppleInc.AppleMusicWin_nzyj5cx40ttqa!app
      caveat: windows_smtc_metadata_malformed

    - # Installed via WebCatalog on Windows 10.
      # Specifying the product name with this identifier, as the identifier
      # alone does not necessarily guarantee that this was installed via
      # WebCatalog (or a different app that runs the web app via Electron).
      app_user_model_id: Apple Music Beta.exe
      product_name: Electron
      caveat: web_playback_info_inaccurate

    - # Installed via WebCatalog on Windows 11.
      app_user_model_id: webcatalog-photon-apple-music-beta
      caveat: web_playback_info_inaccurate

    - # Installed via WebCatalog on Windows 11.
      app_user_model_id: electron.app.Apple Music Beta
      caveat: web_playback_info_inaccurate

    - # Installed via Microsoft Edge on Windows 11.
      app_user_model_id: music.apple.com-A5F611C_7vh1tm7h3g5s0!APP
      caveat: web_playback_info_inaccurate

    - # Installed via Microsoft Edge on Windows 11.
      app_user_model_id: music.apple.com-A5F611C_7vh1tm7h3g5s0!App
      caveat: web_playback_info_inaccurate

    - # Installed via Microsoft Edge on Windows 11.
      app_user_model_id: music.apple.com-A5F611C_7vh1tm7h3g5s0!app
      caveat: web_playback_info_inaccurate

  web_domain:
    - domain: music.apple.com
      caveat: web_playback_info_inaccurate

    - domain: classical.music.apple.com
      caveat: web_playback_info_inaccurate

    - domain: beta.music.apple.com
      caveat: web_playback_info_inaccurate

attributes:
  pure: true
  service: true
content:
  - audio
  - audio_music
extra:
  discord_application_id: "1247654840780460125"
  fluxer_emoji_id: "1549773592797917185"
