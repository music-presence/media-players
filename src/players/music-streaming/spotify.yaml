# yaml-language-server: $schema=../../schemas/player.schema.json

id: spotify
name: Spotify
url: https://spotify.com

caveats:
  # Advertisements in the desktop app can't be skipped, while all other tracks
  # can be skipped at all times, even when there is no previous or next track.
  # More specifically, it's not possible to go to the previous or the next track
  # via the system's media control interface. Advertisements can be filtered out
  # by checking whether skipping is allowed by the media player instance.
  - desktop_app_advertisements_unskippable

sources:
  win_smtc:
    - app_user_model_id: Spotify.exe
      caveat: desktop_app_advertisements_unskippable

    # What exactly is "Spotify Desktop.exe"? Did someone rename Spotify.exe?
    # Source: https://github.com/ungive/discord-music-presence/issues/388
    - app_user_model_id: Spotify Desktop.exe
      caveat: desktop_app_advertisements_unskippable

    - app_user_model_id: SpotifyAB.SpotifyMusic_zpdnekdrzrea0!spotify
      caveat: desktop_app_advertisements_unskippable

    - app_user_model_id: SpotifyAB.SpotifyMusic_zpdnekdrzrea0!Spotify
      caveat: desktop_app_advertisements_unskippable

    - app_user_model_id: SpotifyAB.SpotifyMusic_zpdnekdrzrea0!SPOTIFY
      caveat: desktop_app_advertisements_unskippable

    # Spotify installed via Microsoft Edge on Windows 11
    - open.spotify.com-D55111A4_nwqr74yvdh6rj!app
    - open.spotify.com-D55111A4_nwqr74yvdh6rj!App
    - open.spotify.com-D55111A4_nwqr74yvdh6rj!APP

  mac_bundle:
    - bundle_id: com.spotify.client
      caveat: desktop_app_advertisements_unskippable

  lin_mpris:
    - service: spotify
      caveat: desktop_app_advertisements_unskippable

    - service: Valent
      identity: Spotify

  web_domain:
    - open.spotify.com

attributes:
  pure: true
  service: true
content:
  - audio
  - audio_music
  - audio_podcast
extra:
  discord_application_id: "1247651846936596540"
  fluxer_emoji_id: "1549773084154658816"
